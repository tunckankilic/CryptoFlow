workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "crypto_flow/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "site.tunckankilic.cryptoFlow"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: Code Magic CI/CD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set up environment
        script: |
          cd crypto_flow
          flutter pub get
          cd ios && pod install --repo-update
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Run tests
        script: |
          cd crypto_flow
          flutter test --coverage
        ignore_failure: true
      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0)
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV
          echo "Setting build number to $NEW_BUILD"
      - name: Build iOS
        script: |
          cd crypto_flow
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - crypto_flow/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: iOS Debug Build (PR Check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'fix/*'
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencies
        script: |
          cd crypto_flow
          flutter pub get
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Test
        script: |
          cd crypto_flow
          flutter test
        ignore_failure: true
