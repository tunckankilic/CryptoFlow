workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      cancel_previous_builds: false
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "crypto_flow/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "site.tunckankilic.cryptoFlow"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: CodeMagic CI/CD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set up environment
        script: |
          cd crypto_flow
          flutter pub get
          cd ios && pod install
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Run tests
        script: |
          cd crypto_flow
          flutter test --coverage
        ignore_failure: true
      - name: Check test coverage
        script: |
          cd crypto_flow
          if [ -f coverage/lcov.info ]; then
            COVERAGE=$(flutter pub run coverage:format_coverage \
              --lcov --in=coverage/lcov.info \
              --report-on=lib | \
              grep -oP 'lines\.*: \K[0-9.]+')
            echo "Test coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "Coverage below 80% threshold"
              exit 1
            fi
          fi
        ignore_failure: true
      - name: Build iOS
        script: |
          cd crypto_flow
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - crypto_flow/build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_KEY_IDENTIFIER
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: iOS Debug Build (PR Check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Dependencies
        script: |
          cd crypto_flow
          flutter pub get
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Test
        script: |
          cd crypto_flow
          flutter test
        ignore_failure: true