workflows:
  # Build verification only — never publishes anything.
  #
  # `ios-release` below is the only lane that reaches TestFlight, and it starts
  # on a push to `main`. That left no way to ask CI "does this branch build?"
  # without also shipping it, which matters now that the tree carries thermion:
  # its Filament binaries are fetched by a native-assets build hook that has
  # never once run in CI (locally they are pre-extracted by hand, because this
  # network blocks the CDN at the SNI level). This lane answers that question
  # on a feature branch, in isolation, with nothing published on success.
  #
  # Deliberately has no `triggering:` block — start it by hand from the
  # Codemagic UI against whichever branch you want checked. Automatic runs on
  # every feature-branch push would burn build minutes on a repo whose real
  # release lane only fires on `main`.
  #
  # `ios-release` is intentionally left byte-for-byte unchanged; this lane
  # duplicates a little of its setup rather than refactoring both onto shared
  # YAML anchors, because touching the release lane is exactly what the
  # do-not-touch rule protects against.
  ios-verify:
    name: iOS Build Verification (no publish)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Same pins as ios-release: a check that passes on a different Flutter
      # than the release lane uses is not a check.
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up environment
        script: |
          cd crypto_flow
          flutter pub get
          cd ios && pod install --repo-update
      - name: Stub runtime config
        script: |
          # amplify_outputs.json is gitignored but declared as an asset in
          # pubspec.yaml, so the build fails outright without it. This lane
          # only needs the file to exist and parse — its contents never affect
          # compilation. ios-release generates the real one from the
          # app_store_credentials group; that path is already proven and is not
          # what this lane is here to test.
          set -euo pipefail
          cat > "$CM_BUILD_DIR/crypto_flow/amplify_outputs.json" <<'EOF'
          { "version": "1.4" }
          EOF
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --fatal-infos
      - name: Run app tests
        script: |
          # Builds for the macOS host, which pulls thermion's *macOS* Filament
          # binaries — a different download from the iOS ones exercised by the
          # build step below. Both paths need to work; this is the one that
          # fails locally when the CDN is blocked.
          cd crypto_flow
          flutter test
      - name: Run market_3d package tests
        script: |
          cd crypto_flow/packages/market_3d
          flutter test
      - name: Build iOS (unsigned)
        script: |
          # The real target of this lane: a release-mode device build, which is
          # what links thermion's iOS Filament libraries. Unsigned, so no
          # certificates, no provisioning profiles and no App Store Connect
          # integration are needed — and nothing can be uploaded by accident.
          cd crypto_flow
          flutter build ios --release --no-codesign
    publishing:
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: false
          failure: true

  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "crypto_flow/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "site.tunckankilic.cryptoFlow"
      # Pinned to match .github/workflows/ci.yml. `stable` would float, and a
      # new Flutter release introducing a deprecation info could then block a
      # release build that passed CI unchanged.
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: Code Magic CI/CD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set up environment
        script: |
          cd crypto_flow
          flutter pub get
          cd ios && pod install --repo-update
      - name: Generate runtime config
        script: |
          # amplify_outputs.json and config/*.env are gitignored, so they are
          # NOT in the CI checkout. We generate amplify_outputs.json here and
          # build the dart-defines from environment variables. Each value falls
          # back to the known production default, so the build works with zero
          # Codemagic setup; override any of them in the `app_store_credentials`
          # environment variable group when values change.
          set -euo pipefail
          ENV="${ENV:-prod}"
          AWS_REGION="${AWS_REGION:-eu-central-1}"
          API_BASE_URL="${API_BASE_URL:-https://yj088qs3o6.execute-api.eu-central-1.amazonaws.com/dev}"
          WS_BASE_URL="${WS_BASE_URL:-wss://9bvkaoqkd1.execute-api.eu-central-1.amazonaws.com/dev}"
          BINANCE_REST_URL="${BINANCE_REST_URL:-https://api.binance.com}"
          BINANCE_WS_URL="${BINANCE_WS_URL:-wss://stream.binance.com:9443}"
          COGNITO_USER_POOL_ID="${COGNITO_USER_POOL_ID:-eu-central-1_tcCDzZ2mW}"
          COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID:-ce38mk4k08iib39on8elprsll}"
          COGNITO_IDENTITY_POOL_ID="${COGNITO_IDENTITY_POOL_ID:-eu-central-1:26ad2164-44a2-48ac-a11b-1c1db9884944}"
          COGNITO_DOMAIN="${COGNITO_DOMAIN:-eu-central-1tccdzz2mw.auth.eu-central-1.amazoncognito.com}"
          COGNITO_REDIRECT_SIGN_IN="${COGNITO_REDIRECT_SIGN_IN:-cryptoflow://callback}"
          COGNITO_REDIRECT_SIGN_OUT="${COGNITO_REDIRECT_SIGN_OUT:-cryptoflow://signout}"

          cat > "$CM_BUILD_DIR/crypto_flow/amplify_outputs.json" <<EOF
          {
            "version": "1.4",
            "auth": {
              "aws_region": "${AWS_REGION}",
              "user_pool_id": "${COGNITO_USER_POOL_ID}",
              "user_pool_client_id": "${COGNITO_CLIENT_ID}",
              "identity_pool_id": "${COGNITO_IDENTITY_POOL_ID}",
              "username_attributes": ["email"],
              "standard_required_attributes": ["email"],
              "user_verification_types": ["email"],
              "unauthenticated_identities_enabled": true,
              "mfa_configuration": "NONE",
              "mfa_methods": [],
              "password_policy": {
                "min_length": 8,
                "require_lowercase": true,
                "require_numbers": true,
                "require_symbols": false,
                "require_uppercase": true
              },
              "oauth": {
                "identity_providers": ["SIGN_IN_WITH_APPLE"],
                "domain": "${COGNITO_DOMAIN}",
                "scopes": ["email", "openid", "profile", "aws.cognito.signin.user.admin"],
                "redirect_sign_in_uri": ["${COGNITO_REDIRECT_SIGN_IN}"],
                "redirect_sign_out_uri": ["${COGNITO_REDIRECT_SIGN_OUT}"],
                "response_type": "code"
              }
            }
          }
          EOF

          DART_DEFINES="--dart-define=ENV=$ENV"
          DART_DEFINES="$DART_DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=WS_BASE_URL=$WS_BASE_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=BINANCE_REST_URL=$BINANCE_REST_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=BINANCE_WS_URL=$BINANCE_WS_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_IDENTITY_POOL_ID=$COGNITO_IDENTITY_POOL_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=AWS_REGION=$AWS_REGION"
          echo "FLUTTER_BUILD_ARGS=$DART_DEFINES" >> $CM_ENV
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --fatal-infos
      - name: Run tests
        script: |
          cd crypto_flow
          flutter test --coverage
      - name: Set build number
        script: |
          # App Store Connect requires CFBundleVersion to be strictly higher
          # than any previously uploaded build. The previous step called
          # get-latest-testflight-build-number with the BUNDLE_ID, but that
          # command expects the *numeric App Store App ID*. It failed, the error
          # was swallowed by `|| true`, the number fell back to 1 -> 2, and
          # collided with the existing build 2 (409 DUPLICATE).
          #
          # Use a Unix-timestamp build number: monotonically increasing, always
          # greater than any prior build, and needs no App Store Connect lookup.
          # A 10-digit epoch (~1.7e9) stays well under the 2^32 per-component
          # limit until the year 2106.
          BUILD_NUMBER=$(date +%s)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "Using build number: $BUILD_NUMBER"
      - name: Build iOS
        script: |
          cd crypto_flow
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            $FLUTTER_BUILD_ARGS \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - crypto_flow/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: true
          failure: true
