workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "crypto_flow/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "site.tunckankilic.cryptoFlow"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: Code Magic CI/CD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set up environment
        script: |
          cd crypto_flow
          flutter pub get
          cd ios && pod install --repo-update
      - name: Generate runtime config
        script: |
          # amplify_outputs.json and config/*.env are gitignored, so they are
          # NOT in the CI checkout. We generate amplify_outputs.json here and
          # build the dart-defines from environment variables. Each value falls
          # back to the known production default, so the build works with zero
          # Codemagic setup; override any of them in the `app_store_credentials`
          # environment variable group when values change.
          set -euo pipefail
          ENV="${ENV:-prod}"
          AWS_REGION="${AWS_REGION:-eu-central-1}"
          API_BASE_URL="${API_BASE_URL:-https://yj088qs3o6.execute-api.eu-central-1.amazonaws.com/dev}"
          WS_BASE_URL="${WS_BASE_URL:-wss://9bvkaoqkd1.execute-api.eu-central-1.amazonaws.com/dev}"
          BINANCE_REST_URL="${BINANCE_REST_URL:-https://api.binance.com}"
          BINANCE_WS_URL="${BINANCE_WS_URL:-wss://stream.binance.com:9443}"
          COGNITO_USER_POOL_ID="${COGNITO_USER_POOL_ID:-eu-central-1_tcCDzZ2mW}"
          COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID:-ce38mk4k08iib39on8elprsll}"
          COGNITO_IDENTITY_POOL_ID="${COGNITO_IDENTITY_POOL_ID:-eu-central-1:26ad2164-44a2-48ac-a11b-1c1db9884944}"
          COGNITO_DOMAIN="${COGNITO_DOMAIN:-eu-central-1tccdz2mw.auth.eu-central-1.amazoncognito.com}"
          COGNITO_REDIRECT_SIGN_IN="${COGNITO_REDIRECT_SIGN_IN:-cryptoflow://callback}"
          COGNITO_REDIRECT_SIGN_OUT="${COGNITO_REDIRECT_SIGN_OUT:-cryptoflow://signout}"

          cat > "$CM_BUILD_DIR/crypto_flow/amplify_outputs.json" <<EOF
          {
            "version": "1.4",
            "auth": {
              "aws_region": "${AWS_REGION}",
              "user_pool_id": "${COGNITO_USER_POOL_ID}",
              "user_pool_client_id": "${COGNITO_CLIENT_ID}",
              "identity_pool_id": "${COGNITO_IDENTITY_POOL_ID}",
              "username_attributes": ["email"],
              "standard_required_attributes": ["email"],
              "user_verification_types": ["email"],
              "unauthenticated_identities_enabled": true,
              "mfa_configuration": "NONE",
              "mfa_methods": [],
              "password_policy": {
                "min_length": 8,
                "require_lowercase": true,
                "require_numbers": true,
                "require_symbols": false,
                "require_uppercase": true
              },
              "oauth": {
                "identity_providers": ["SignInWithApple"],
                "domain": "${COGNITO_DOMAIN}",
                "scopes": ["email", "openid", "profile"],
                "redirect_sign_in_uri": ["${COGNITO_REDIRECT_SIGN_IN}"],
                "redirect_sign_out_uri": ["${COGNITO_REDIRECT_SIGN_OUT}"],
                "response_type": "code"
              }
            }
          }
          EOF

          DART_DEFINES="--dart-define=ENV=$ENV"
          DART_DEFINES="$DART_DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=WS_BASE_URL=$WS_BASE_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=BINANCE_REST_URL=$BINANCE_REST_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=BINANCE_WS_URL=$BINANCE_WS_URL"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=COGNITO_IDENTITY_POOL_ID=$COGNITO_IDENTITY_POOL_ID"
          DART_DEFINES="$DART_DEFINES --dart-define=AWS_REGION=$AWS_REGION"
          echo "FLUTTER_BUILD_ARGS=$DART_DEFINES" >> $CM_ENV
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Run tests
        script: |
          cd crypto_flow
          flutter test --coverage
        ignore_failure: true
      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" = "0" ]; then
            LATEST_BUILD=1
          fi
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV
          echo "Latest build: $LATEST_BUILD -> New build: $NEW_BUILD"
      - name: Build iOS
        script: |
          cd crypto_flow
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            $FLUTTER_BUILD_ARGS \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - crypto_flow/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: iOS Debug Build (PR Check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'fix/*'
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencies
        script: |
          cd crypto_flow
          flutter pub get
      - name: Flutter analyze
        script: |
          cd crypto_flow
          flutter analyze --no-fatal-warnings
        ignore_failure: true
      - name: Test
        script: |
          cd crypto_flow
          flutter test
        ignore_failure: true
