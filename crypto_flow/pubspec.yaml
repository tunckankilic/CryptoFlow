name: crypto_wave
description: CryptoWave - Real-time cryptocurrency tracker with Binance WebSocket
publish_to: 'none'

version: 1.1.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Local Packages
  core:
    path: packages/core
  design_system:
    path: packages/design_system
  market:
    path: packages/market
  portfolio:
    path: packages/portfolio
  alerts:
    path: packages/alerts
  watchlist:
    path: packages/watchlist
  settings:
    path: packages/settings
  auth:
    path: packages/auth
  notifications:
    path: packages/notifications
  
  # DI
  get_it: ^9.2.0
  injectable: ^2.3.0
  
  # Navigation
  go_router: ^14.8.1
  
  # State
  flutter_bloc: ^9.1.1
  
  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.0

  dio: any
  connectivity_plus: any
  hive_flutter: any
  firebase_messaging: any
  flutter_local_notifications: any
  firebase_core: any

  # AWS Amplify (Cognito auth) — coexists with Firebase behind useCognitoAuth flag
  amplify_flutter: ^2.6.1
  amplify_auth_cognito: ^2.6.1

  # WidgetKit bridge (iOS home screen widgets)
  home_widget: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  injectable_generator: ^2.4.0
  build_runner: ^2.4.0
  
  # Testing
  mocktail: ^1.0.0
  bloc_test: ^10.0.0

  dartz: any
flutter:
  uses-material-design: true
  assets:
    - assets/
    - amplify_outputs.json
